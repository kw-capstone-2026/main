# ──────────────────────────────────────────────────────────────
# docker-compose.yml
# ──────────────────────────────────────────────────────────────
#
# ❓ 이 파일이 하는 일:
#   PostgreSQL + PostGIS 데이터베이스를 내 컴퓨터에서 실행합니다.
#   MySQL Workbench에서 직접 DB 설치하는 것과 같은 역할이지만,
#   이 파일 하나로 팀원 전원이 동일한 환경을 자동으로 구성합니다.
#
# ✅ 사용법 (이것만 하면 됨):
#   시작: docker compose up -d --build
#   종료: docker compose down
#   완전 초기화(데이터 삭제): docker compose down -v
#
# DB 접속 정보와 JWT 키는 프로젝트 루트 .env에서만 가져옵니다.
# ──────────────────────────────────────────────────────────────

services:
  db:
    # PostgreSQL 15 + PostGIS 3.4 이미지 (자동 다운로드됨, 직접 설치 불필요)
    image: postgis/postgis:15-3.4

    # 컨테이너 이름 (docker exec 명령어에서 사용)
    container_name: capstone-db

    # DB 환경변수 설정
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}

    # 포트: 내 컴퓨터 5432 → 컨테이너 내부 5432
    # (Spring Boot, Python 코드 전부 localhost:5432로 접속)
    ports:
      - "5432:5432"

    # 데이터 저장소
    # docker compose down 해도 데이터 유지됨
    # docker compose down -v 하면 데이터 삭제됨 (초기화)
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 새 DB 볼륨에서 스키마 → 기본 계정/seed → AI 실데이터 순서로 자동 적용
      # 기존 볼륨은 자동 재적재하지 않습니다.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/seed-ai-2024q4.sql.gz:/docker-entrypoint-initdb.d/03-ai-2024q4.sql.gz:ro

    # DB 상태 확인 (backend가 뜨기 전에 DB가 준비됐는지 체크)
    healthcheck:
      # 초기화용 임시 서버가 아닌, 실데이터 적재 후 시작한 TCP 서버를 확인
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

    # 컨테이너가 예기치 않게 종료되면 자동 재시작
    restart: unless-stopped

  backend:
    build:
      context: ./backend/survival-api
      dockerfile: Dockerfile
    container_name: capstone-backend
    ports:
      - "8080:8080"
    environment:
      # Docker 내부용 URL도 .env에서 설정합니다.
      DB_URL: ${DOCKER_DB_URL:?DOCKER_DB_URL must be set in .env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

# 데이터 영구 보관용 볼륨
volumes:
  pgdata:
